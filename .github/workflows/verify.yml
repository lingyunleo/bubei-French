name: Verify single-file release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build
      - name: Check reproducible release
        run: git diff --exit-code -- '*.html'
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node-verification-results
          path: test-results/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: bubei-french-single-html
          path: 不背法语-*.html
  browsers:
    # Linux WebKit's EGL context teardown crashes in the cache-restoration test.
    # Keep both engines and every assertion on macOS; do not disable WebGL.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install chromium webkit
      - run: npm run build
      - name: Check reproducible release
        run: git diff --exit-code -- '*.html'
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification-results
          path: test-results/
          retention-days: 14
